<div style="position: relative; width: 100%; height: 100%; overflow: hidden;">
    <video autoplay muted playsinline id="myVideo" width="100%" height="100%" style="object-fit: cover; display: block;">
        <source src="videos/bg5.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <button id="playBtn" style="
        display: none;
        position: absolute;
        top: 24px;
        right: 24px;
        background-color: #007bff;
        color: #ffffff;
        border: none;
        border-radius: 50px;
        padding: 18px 36px;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        z-index: 10;
    ">
        ↺ Replay
    </button>
</div>

<script>
    const video = document.getElementById('myVideo');
    const playBtn = document.getElementById('playBtn');

    // Show the button once the muted autoplay finishes
    video.addEventListener('ended', () => {
        playBtn.style.display = 'block';
    });

    // Replay unmuted on click
    playBtn.addEventListener('click', () => {
        video.muted = false;
        video.currentTime = 0;
        video.play();
        playBtn.style.display = 'none';
    });
</script>
